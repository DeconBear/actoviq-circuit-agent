name: Publish to npm

# Desktop GitHub Releases are handled by release-desktop.yml on v* tags.
# Keep npm publish manual until the vibe-analog package is intentionally published.
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - run: npm install --location=global npm@11.5.1
      - run: npm ci
      - run: npm publish --access public --provenance
