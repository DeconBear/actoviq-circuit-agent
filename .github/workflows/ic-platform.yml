name: IC platform

on:
  pull_request:
  push:
    branches: [main]

jobs:
  linux-open-tools:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-circuit.txt
      - run: sudo apt-get update
      - run: sudo apt-get install -y ngspice iverilog yosys
      - run: python -m pip install --requirement requirements-circuit.txt
      - run: npm ci
      - run: npm run test:ic-platform
      - run: python scripts/open-tool-qualification.py --require ngspice,iverilog,yosys --output output/qualification/linux-open-tools.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-open-tool-qualification
          path: output/qualification/
