appId: com.vibeanalog.app
productName: Vibe Analog
directories:
  output: release
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
files:
  - dist/**/*
  - dist-electron/**/*
  - dist-renderer/**/*
  - embedded/**/*
  - skills/**/*
  - python/**/*
  - bin/**/*
  - package.json
  - agent.settings.example.json
  - README.md
  - README-zh.md
extraResources:
  - from: embedded/
    to: embedded/
  - from: skills/
    to: skills/
  - from: assets/
    to: assets/
win:
  target:
    - nsis
  icon: assets/icon.ico
mac:
  target:
    - dmg
  icon: assets/icon.png
  category: public.app-category.developer-tools
linux:
  target:
    - AppImage
  icon: assets/icon.png
  category: Science
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
publish:
  provider: github
  owner: DeconBear
  repo: vibe-analog
